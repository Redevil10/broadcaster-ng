[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "broadcaster-ng"
dynamic = ["version"]
description = "Simple broadcast channels. Maintained fork of encode/broadcaster with connection-loss fixes."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Tom Christie", email = "tom@tomchristie.com" },
    { name = "Qing Wan", email = "juveseason@gmail.com" },
]
maintainers = [
    { name = "Qing Wan", email = "juveseason@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "anyio>=3.4.0,<5",
]

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["asyncpg"]
kafka = ["aiokafka"]
test =  ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/Redevil10/broadcaster-ng"
Issues = "https://github.com/Redevil10/broadcaster-ng/issues"
Upstream = "https://github.com/encode/broadcaster"

[tool.hatch.version]
path = "broadcaster/__init__.py"

[tool.hatch.build.targets.wheel]
# PyPI name is broadcaster-ng, import name stays `broadcaster`.
packages = ["broadcaster"]

[tool.hatch.build.targets.sdist]
include = [
    "/broadcaster",
]

[tool.ruff]
line-length = 120
# Byte-identical copies of upstream test files.
extend-exclude = ["tests_upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "FA", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true
python_version = "3.10"
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-rxXs"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = "copied_from(source, changes=None): mark test as copied from somewhere else, along with a description of changes made to accodomate e.g. our test setup"

[tool.coverage.run]
# Measure the library only (test files are near 100% by definition), with
# branch coverage.
source_pkgs = ["broadcaster"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
