services:
  kafka:
    # Single-node KRaft broker; default config listens on localhost:9092.
    image: "apache/kafka:3.9.1"
    ports:
      - 9092:9092
  redis:
    image: "redis:7-alpine"
    ports:
      - 6379:6379
  postgres:
    image: "postgres:16"
    environment:
      - POSTGRES_DB=broadcaster
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
    ports:
      # Override when a local Postgres already uses 5432, e.g. POSTGRES_HOST_PORT=55432
      # (then set BROADCASTER_TEST_POSTGRES_URL to match).
      - ${POSTGRES_HOST_PORT:-5432}:5432
