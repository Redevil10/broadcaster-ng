---
name: Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} / redis-py ${{ matrix.redis-py }}"
    runs-on: "ubuntu-latest"
    # A hang (e.g. a subscriber that never receives) should fail fast,
    # not run until GitHub's 6-hour limit.
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        redis-py: ["latest"]
        include:
          # Oldest supported redis-py major.
          - python-version: "3.10"
            redis-py: "5"
          - python-version: "3.14"
            redis-py: "5"

    services:
      kafka:
        # Single-node KRaft broker; default config listens on localhost:9092.
        image: apache/kafka:4.4.0
        ports:
          - 9092:9092
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: broadcaster
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: "Install dependencies"
        run: "scripts/install"
      - name: "Pin redis-py major"
        if: matrix.redis-py != 'latest'
        run: pip install "redis==${{ matrix.redis-py }}.*"
      - name: "Run linting checks"
        run: "scripts/check"
      - name: "Build package & docs"
        run: "scripts/build"
      - name: "Run tests"
        run: "scripts/test"
      - name: "Enforce coverage"
        run: "scripts/coverage"
