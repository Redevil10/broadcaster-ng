name: Publish

# Runs when a GitHub Release is published (not on plain tag pushes).
# Uses PyPI trusted publishing: no API token is stored in the repo.
# One-time setup on PyPI: add a (pending) trusted publisher for project
# "broadcaster-ng", owner "Redevil10", repo "broadcaster-ng",
# workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: "Build distributions"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.13"
      - name: "Check the release tag matches the package version"
        run: |
          VERSION=$(grep __version__ broadcaster/__init__.py | grep -o '[0-9][^"]*')
          if [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match package version '${VERSION}'"
            exit 1
          fi
      - name: "Build"
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: "actions/upload-artifact@v7"
        with:
          name: dist
          path: dist/

  publish:
    name: "Publish to PyPI"
    needs: build
    runs-on: "ubuntu-latest"
    environment:
      name: pypi
      url: https://pypi.org/p/broadcaster-ng
    permissions:
      id-token: write
    steps:
      - uses: "actions/download-artifact@v8"
        with:
          name: dist
          path: dist/
      - uses: "pypa/gh-action-pypi-publish@release/v1"
