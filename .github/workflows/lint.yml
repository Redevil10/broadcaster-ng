name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      # Same ruff version as requirements.txt, so CI and local runs agree.
      - name: Run ruff lint
        run: uvx ruff@0.17.4 check broadcaster tests

      - name: Run ruff format
        run: uvx ruff@0.17.4 format --check --diff broadcaster tests

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install -r requirements.txt

      - name: Run type check
        run: uv run --no-project mypy broadcaster tests
