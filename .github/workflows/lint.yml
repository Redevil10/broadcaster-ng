name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      # The same hooks as the local git hooks (prek.toml): ruff lint and
      # format, plus whitespace / YAML / TOML / merge-conflict checks.
      - name: Run prek hooks
        run: uvx prek@0.5.10 run --all-files --show-diff-on-failure

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install -r requirements.txt

      - name: Run type check
        run: uv run --no-project mypy broadcaster tests
